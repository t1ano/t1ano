name: update profile cards

on:
  schedule:
    - cron: "0 0 * * *" # runs every day at 00:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: t1ano
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#4b91f1&color_dots=#0d1117,#0a3069,#0d4ea1,#1f6feb,#4b91f1
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#4b91f1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=t1ano&show_icons=true&theme=tokyonight&hide_border=true&title_color=4b91f1&icon_color=4b91f1&text_color=c9d1d9&bg_color=0d1117
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=t1ano&layout=compact&theme=tokyonight&hide_border=true&title_color=4b91f1&text_color=c9d1d9&bg_color=0d1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=t1ano&theme=tokyonight&hide_border=true&background=0d1117&ring=4b91f1&fire=4b91f1&currStreakLabel=4b91f1
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile stats cards" || exit 0
          git push
